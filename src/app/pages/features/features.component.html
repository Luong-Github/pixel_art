<section class="section-tight page-hero">
  <div class="container">
    <span class="eyebrow">{{ 'features.eyebrow' | t }}</span>
    <h1 class="h-xl">{{ 'features.title' | t }}</h1>
    <p class="lead">
      {{ 'features.lead' | t }}
    </p>
    <a routerLink="/editor" class="btn btn-primary btn-lg">{{ 'features.tryNow' | t }}</a>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="grid grid-3">
      <article class="card card-hover group" *ngFor="let g of groups">
        <h2>{{ g.areaKey | t }}</h2>
        <ul>
          <li *ngFor="let i of g.itemKeys">{{ i | t }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="sec-head">
      <span class="eyebrow">{{ 'features.keyboardFirst' | t }}</span>
      <h2 class="h-lg">{{ 'features.shortcutsTitle' | t }}</h2>
    </div>
    <div class="keys">
      <div class="key" *ngFor="let k of shortcuts">
        <kbd>{{ k[0] }}</kbd>
        <span>{{ k[1] | t }}</span>
      </div>
    </div>
  </div>
</section>
