<section class="section-tight page-hero">
  <div class="container center">
    <span class="eyebrow">Pricing</span>
    <h1 class="h-xl">Start free. Upgrade when you grow.</h1>
    <p class="lead">The core editor is free forever. Paid plans add cloud sync and extras.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="grid grid-3 plans">
      <article class="card plan" *ngFor="let p of plans" [class.featured]="p.featured">
        <span class="badge" *ngIf="p.featured">Most popular</span>
        <h2>{{ p.name }}</h2>
        <div class="price">
          <strong>{{ p.price }}</strong>
          <span>{{ p.period }}</span>
        </div>
        <p class="blurb">{{ p.blurb }}</p>
        <a
          [routerLink]="p.ctaLink"
          class="btn"
          [class.btn-primary]="p.featured"
          [class.btn-ghost]="!p.featured"
          >{{ p.cta }}</a
        >
        <ul>
          <li *ngFor="let f of p.features">{{ f }}</li>
        </ul>
      </article>
    </div>
    <p class="note">Prices shown are illustrative — billing isn’t enabled yet.</p>
  </div>
</section>
