<section class="section-tight page-hero">
  <div class="container center">
    <span class="eyebrow">{{ 'pricing.eyebrow' | t }}</span>
    <h1 class="h-xl">{{ 'pricing.heroTitle' | t }}</h1>
    <p class="lead">{{ 'pricing.heroLead' | t }}</p>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="grid grid-3 plans">
      <article class="card plan" *ngFor="let p of plans" [class.featured]="p.featured">
        <span class="badge" *ngIf="p.featured">{{ 'pricing.mostPopular' | t }}</span>
        <h2>{{ p.nameKey | t }}</h2>
        <div class="price">
          <strong>{{ p.price }}</strong>
          <span>{{ p.periodKey | t }}</span>
        </div>
        <p class="blurb">{{ p.blurbKey | t }}</p>
        <a
          [routerLink]="p.ctaLink"
          class="btn"
          [class.btn-primary]="p.featured"
          [class.btn-ghost]="!p.featured"
          >{{ p.ctaKey | t }}</a
        >
        <ul>
          <li *ngFor="let f of p.featureKeys">{{ f | t }}</li>
        </ul>
      </article>
    </div>
    <p class="note">{{ 'pricing.note' | t }}</p>
  </div>
</section>
